<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Studio">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="color-scheme" content="dark light">
<meta name="description" content="Planen, posten und auswerten für sommer_gram">
<title>Studio Sommer_gram</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<script>(function(){var t="dark";try{t=localStorage.getItem("sg-theme")||"dark"}catch(e){}if(t==="light"||t==="dark")document.documentElement.setAttribute("data-sg",t)})()</script>
<style>
/* Dunkelkammer: Seitenleiste links, Fotos groß, Bernstein als einziges Signal. Hell = Papier, Dunkel = Dunkelkammer. data-sg = Wahl im Studio, ohne Wahl folgt es dem Gerät */
:root{
  --bg:#F2F0EB; --card:#FFFFFF; --field:#EAE7E1; --field-2:#D9D5CC; --line:#E2DED6;
  --text:#171614; --text-2:#5C5850; --text-3:#8A857B; --ink:#171614; --on-ink:#FFFFFF;
  --peach:#F5E2C0; --peach-soft:#FBF3E4; --accent:#A4620A; --amber:#E8A33D; --on-amber:#1A1206; --accent-fill:rgba(232,163,61,.18);
  --ok:#2E8B57; --ok-soft:#E2F1E7; --info:#3D6FC4; --warn:#C25E2C; --bad:#C8372D; --muted:#A29D93; --c-reel:#9457AB;
  --side:#E8E5DF; --hero-shadow:0 18px 44px rgba(60,45,20,.18); color-scheme:light;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-field:12px; --r-card:20px; --side-w:92px;
}
@media (prefers-color-scheme: dark){:root:not([data-sg]):not([data-theme="light"]){
  --bg:#0D0D0C; --card:#151513; --field:#1E1D1B; --field-2:#2D2C29; --line:#262521;
  --text:#EDEBE6; --text-2:#A8A399; --text-3:#726E66; --ink:#EDEBE6; --on-ink:#0D0D0C;
  --peach:#2C2113; --peach-soft:#1B160E; --accent:#E8A33D; --amber:#E8A33D; --on-amber:#140F05; --accent-fill:rgba(232,163,61,.16);
  --ok:#7CC79A; --ok-soft:#15211A; --info:#8FB0E8; --warn:#E58A5C; --bad:#FF7A70; --muted:#78746C; --c-reel:#C99BDA;
  --side:#090908; --hero-shadow:0 28px 64px rgba(0,0,0,.6); color-scheme:dark}}
:root:not([data-sg])[data-theme="dark"]{
  --bg:#0D0D0C; --card:#151513; --field:#1E1D1B; --field-2:#2D2C29; --line:#262521;
  --text:#EDEBE6; --text-2:#A8A399; --text-3:#726E66; --ink:#EDEBE6; --on-ink:#0D0D0C;
  --peach:#2C2113; --peach-soft:#1B160E; --accent:#E8A33D; --amber:#E8A33D; --on-amber:#140F05; --accent-fill:rgba(232,163,61,.16);
  --ok:#7CC79A; --ok-soft:#15211A; --info:#8FB0E8; --warn:#E58A5C; --bad:#FF7A70; --muted:#78746C; --c-reel:#C99BDA;
  --side:#090908; --hero-shadow:0 28px 64px rgba(0,0,0,.6); color-scheme:dark}
:root[data-sg="dark"]{
  --bg:#0D0D0C; --card:#151513; --field:#1E1D1B; --field-2:#2D2C29; --line:#262521;
  --text:#EDEBE6; --text-2:#A8A399; --text-3:#726E66; --ink:#EDEBE6; --on-ink:#0D0D0C;
  --peach:#2C2113; --peach-soft:#1B160E; --accent:#E8A33D; --amber:#E8A33D; --on-amber:#140F05; --accent-fill:rgba(232,163,61,.16);
  --ok:#7CC79A; --ok-soft:#15211A; --info:#8FB0E8; --warn:#E58A5C; --bad:#FF7A70; --muted:#78746C; --c-reel:#C99BDA;
  --side:#090908; --hero-shadow:0 28px 64px rgba(0,0,0,.6); color-scheme:dark}
:root[data-sg="light"]{
  --bg:#F2F0EB; --card:#FFFFFF; --field:#EAE7E1; --field-2:#D9D5CC; --line:#E2DED6;
  --text:#171614; --text-2:#5C5850; --text-3:#8A857B; --ink:#171614; --on-ink:#FFFFFF;
  --peach:#F5E2C0; --peach-soft:#FBF3E4; --accent:#A4620A; --amber:#E8A33D; --on-amber:#1A1206; --accent-fill:rgba(232,163,61,.18);
  --ok:#2E8B57; --ok-soft:#E2F1E7; --info:#3D6FC4; --warn:#C25E2C; --bad:#C8372D; --muted:#A29D93; --c-reel:#9457AB;
  --side:#E8E5DF; --hero-shadow:0 18px 44px rgba(60,45,20,.18); color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:400 15px/1.45 var(--sans);padding-left:calc(var(--side-w) + env(safe-area-inset-left,0px));-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.wrap{max-width:1240px;margin:0 auto;padding-block:28px 64px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-.03em;margin:0;text-wrap:balance}
a.home{color:inherit;text-decoration:none;cursor:pointer;border-radius:8px}
a.home:hover{opacity:.75}
h2{font-size:18px;font-weight:700;letter-spacing:-.015em;margin:0}
.sub{display:flex;align-items:center;gap:10px;margin-top:0;color:var(--text-2);font-size:13px;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--peach);color:var(--accent)}
.conn{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);background:var(--field);border-radius:999px;padding:6px 12px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.tabs{display:inline-flex;background:var(--field);border-radius:999px;padding:4px;gap:2px}
.tabs a{padding:8px 18px;border-radius:999px;text-decoration:none;color:var(--text-2);font-weight:600;font-size:14px}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--on-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:24px;min-width:0}
.card>h2+*{margin-top:16px}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
.muted{color:var(--text-2)}
.small{font-size:13px}
.field{width:100%;background:var(--field);border:1px solid transparent;border-radius:var(--r-field);padding:11px 14px;outline:none}
.field:focus{border-color:var(--text-3);background:var(--card)}
textarea.field{resize:vertical;min-height:130px;line-height:1.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.stack{display:flex;flex-direction:column;gap:6px;min-width:0}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;min-height:36px}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.pill:hover{border-color:var(--text-3)}
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:700;cursor:pointer;background:var(--amber);color:var(--on-amber);min-height:42px;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:var(--field);color:var(--text)}
.btn.soft{background:var(--peach);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:7px 14px;min-height:34px;font-size:13px}
.linkish{background:none;border:0;padding:0;color:var(--text-2);text-decoration:underline;cursor:pointer;font-size:13px;min-height:24px}
.notice{border-radius:16px;padding:12px 16px;background:var(--peach-soft);border:1px solid var(--peach);font-size:14px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.notice.bad{background:transparent;border-color:var(--bad)}

/* Posten */
.compose{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:34px}
.drop{aspect-ratio:4/5;max-width:100%;border-radius:18px;background:var(--field);border:1.5px dashed var(--field-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden;cursor:pointer}
.drop.has{border:0;border-radius:8px;box-shadow:var(--hero-shadow);cursor:zoom-in}
.lb{position:fixed;inset:0;z-index:70;background:rgba(10,10,10,.92);display:flex;align-items:center;justify-content:center;padding:calc(56px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(56px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb[hidden]{display:none!important}
.lb img{max-width:100%;max-height:100%;object-fit:contain;flex:none;border-radius:6px;display:block;will-change:transform;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.lb button{position:absolute;border:0;background:rgba(255,255,255,.14);color:#fff;width:48px;height:48px;border-radius:50%;font-size:22px;cursor:pointer;display:grid;place-items:center}
.lb button:hover{background:rgba(255,255,255,.26)}
.lb .lbx{top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px))}
.lb .lbp{left:max(12px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%)}
.lb .lbn{right:max(12px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%)}
.lb .lbc{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);color:#ddd;font-size:14px}
.drop.reel{aspect-ratio:9/16;max-height:520px}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.plus{width:44px;height:44px;border-radius:50%;background:var(--amber);color:var(--on-amber);display:grid;place-items:center;font-size:24px;font-weight:300}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumb{width:56px;aspect-ratio:4/5;border-radius:8px;overflow:hidden;position:relative;background:var(--field);border:2px solid transparent;cursor:pointer;padding:0}
.thumb.on{border-color:var(--amber)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:11px;display:grid;place-items:center;border:0;cursor:pointer}
.thumb.add{display:grid;place-items:center;font-size:20px;color:var(--text-2)}
.thumb[data-cur]{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.thumb .tn{position:absolute;left:3px;bottom:3px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.thumb.dragph{border:2px dashed var(--text-3)}
.dragghost{position:fixed;z-index:90;pointer-events:none;margin:0;transform:scale(1.06);box-shadow:0 18px 40px rgba(0,0,0,.32);cursor:grabbing;border-radius:10px;overflow:hidden}
.dragph{opacity:.25}
.fchips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;align-items:center}
.pill.sm{min-height:34px;padding:6px 12px;font-size:13px}
.pill .muted{font-weight:500;margin-left:2px}
.ghostpill{border-style:dashed;color:var(--text-2)}
.tile.dragable{cursor:grab}
.tile.lift{transform:scale(1.04);box-shadow:0 10px 24px rgba(0,0,0,.25);z-index:2;transition:transform .15s,box-shadow .15s}
.tile .rk{position:absolute;right:6px;bottom:6px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.counter{font-family:var(--mono);font-size:11px;color:var(--text-3)}
.feedprev{background:var(--field);border-radius:var(--r-field);padding:12px 14px;font-size:14px}
.feedprev b{font-weight:700}
.feedprev .more{color:var(--text-3)}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.checks span{display:inline-flex;align-items:center;gap:6px}
.sugg{display:flex;flex-direction:column;gap:8px}
.sugg button{text-align:left;background:var(--peach-soft);border:1px solid var(--peach);border-radius:var(--r-field);padding:10px 14px;cursor:pointer}
.sugg button:hover{border-color:var(--accent)}
.confirm{border:1px solid var(--ink);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.feedgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;border-radius:14px;overflow:hidden}
.tile{aspect-ratio:4/5;background:var(--field);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:8px;font-size:11.5px;color:var(--text-2);border:0;cursor:pointer;text-align:left}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .badge{position:absolute;top:6px;left:6px;font:700 10px var(--mono);padding:3px 7px;border-radius:5px;background:rgba(0,0,0,.62);color:#fff;max-width:calc(100% - 12px);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tile span.t{position:relative}
.tile.on{outline:3px solid var(--amber);outline-offset:-3px}
.bottom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:700px){.bottom{grid-template-columns:minmax(0,1fr)}}

/* Plan */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--field);border-radius:16px;padding:10px;min-height:150px;display:flex;flex-direction:column;gap:6px;min-width:0}
.day.today{outline:1.5px solid var(--text)}
.dayhead{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);font-weight:600}
.dayhead b{color:var(--text);font-size:15px}
.ev.ig{background:var(--ok-soft);border-color:var(--ok)}
.ev.ig .me{color:var(--ok);font-weight:600}
.tile .badge.ok{background:var(--ok);color:var(--on-ink)}
.ev{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:12.5px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.ev .ti{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .me{display:flex;align-items:center;gap:6px;color:var(--text-2);font-size:11.5px}
.month .wdh{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);padding:0 4px 2px}
.day.dim{opacity:.45}
.day.dropto{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--peach-soft)}
.ev.dragable{cursor:grab}.ev.lift{transform:scale(1.04);box-shadow:0 8px 20px rgba(0,0,0,.2)}
.month .dayhead span{display:none}
.ev .evi{display:none}.month .ev .evi{display:block;width:100%;height:64px;object-fit:cover;border-radius:6px;margin-bottom:4px}
.ev.pub{background:transparent}
.ev.story{border-style:dashed}
.slot{border:1.5px dashed var(--field-2);border-radius:10px;padding:7px 9px;font-size:12px;color:var(--text-3);background:transparent;cursor:pointer;text-align:left}
.slot:hover{border-color:var(--accent);color:var(--accent)}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.mini{width:52px;aspect-ratio:4/5;border-radius:8px;background:var(--field);overflow:hidden}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
.li .ti{font-weight:600}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2);white-space:nowrap}

/* Analytics */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--field);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi.hi{background:var(--peach-soft);box-shadow:inset 0 0 0 1px var(--peach)}.kpi.hi .v{color:var(--accent)}
.kpi .v{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.kpi .d{font-size:12px;font-weight:700}
.kpi .s{font-size:12px;color:var(--text-2)}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-size:11px;fill:var(--text-3);font-family:var(--sans)}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.num,th.num{text-align:right}
.ahead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:22px}
.hbars{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:minmax(90px,130px) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:14px}
.hb .hl{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .ht{height:10px;background:var(--field);border-radius:99px;overflow:hidden}
.hb .ht span{display:block;height:100%;border-radius:99px;min-width:2px}
.hb .hv{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.mrow{display:flex;gap:12px;align-items:center;min-width:180px}
.mrow .mini{width:40px;flex:none}
.mtype{display:grid;place-items:center;width:100%;height:100%;color:#fff;font-weight:800;font-size:14px}
table.mt td{vertical-align:middle}
details summary{cursor:pointer;color:var(--text-2)}
.field.sm{padding:6px 10px;min-height:34px;font-size:13px;width:auto}
.pb .col{cursor:pointer;outline:none}
.pb .col .bar{transition:opacity .15s,filter .15s}
.pb .col:hover .bar,.pb .col:focus-visible .bar{filter:brightness(1.12)}
.pb .col:focus-visible .hit{fill:var(--field)}
tr.click{cursor:pointer}tr.click:hover td,tr.click:focus-visible td{background:var(--field)}
.mo{position:fixed;inset:0;z-index:65;background:rgba(10,10,10,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.mo[hidden]{display:none!important}
.mocard{position:relative;width:min(900px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--card);border-radius:22px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);box-shadow:0 30px 80px rgba(0,0,0,.35);will-change:transform}
.momedia{position:relative;aspect-ratio:4/5;background:var(--field);overflow:hidden;align-self:start}
.momedia img{width:100%;height:100%;object-fit:cover;display:block}
.momedia.dz{outline:3px dashed var(--accent);outline-offset:-10px}
.moph{width:100%;height:100%;display:grid;place-content:center;gap:8px;text-align:center;padding:24px;background:linear-gradient(160deg,color-mix(in srgb,var(--c,var(--accent)) 30%,var(--field)),var(--field))}
.momedia.noimg{aspect-ratio:auto;min-height:220px;height:100%}
.mocard.st{grid-template-columns:min(400px,calc((100dvh - 32px)*.5625)) minmax(0,1fr)}.mocard.st .momedia{aspect-ratio:9/16}
.moph span{font-size:28px;font-weight:800}.moph small{color:var(--text-2);font-size:13px}

<script>
/* ---------- Grundlagen ---------- */
const BRAND_FALLBACK="7224830";
const MC="Metricool Social Media Management";
const FORMATS={POST:"Foto",KARUSSELL:"Karussell",REEL:"Reel",STORY:"Story"};
const STATUS={entwurf:["Entwurf","var(--muted)"],geplant:["Geplant","var(--info)"],freigegeben:["Freigegeben für Instagram","var(--warn)"],instagram:["In Instagram eingeplant","var(--ok)"],metricool:["Bei Metricool","var(--accent)"],veroeffentlicht:["Veröffentlicht","var(--ok)"]};
const SLOTS={3:"18:30",5:"19:30",0:"18:00"}; // Mi, Fr, So
const WD=["So","Mo","Di","Mi","Do","Fr","Sa"];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=n=>n==null||isNaN(n)?"–":Number(n).toLocaleString("de-DE");
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>new Date(s+"T12:00:00");
const fmtD=s=>{if(!s)return "ohne Termin";const d=parse(s);return WD[d.getDay()]+", "+pad(d.getDate())+"."+pad(d.getMonth()+1)+"."};
const uid=()=>"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const imgSrc=im=>{if(!im)return "";if(im.local)return im.local;const id=im.id||((im.url||"").match(/_blob\/([^/?#]+)/)||[])[1];if(window.__bild&&id)return window.__bild(id);return im.url||(id?"/_blob/"+id:"")};
const countTags=s=>(String(s).match(/#[\p{L}\p{N}_]+/gu)||[]).length;
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}
function statusHTML(s){const x=STATUS[s]||STATUS.entwurf;return `<span class="status"><span class="dot" style="background:${x[1]}"></span>${x[0]}</span>`}
function er(st){if(!st||!st.views)return null;const parts=["likes","comments","shares","saves"].map(k=>st[k]).filter(v=>v!=null&&v!=="");const sum=parts.length?parts.reduce((a,b)=>a+(+b||0),0):(+st.interactions||0);return sum/st.views*100}
function tzOffset(dateStr,timeStr){const d=new Date(dateStr+"T"+timeStr+":00");const m=-d.getTimezoneOffset();const s=m>=0?"+":"-";return s+pad(Math.floor(Math.abs(m)/60))+":"+pad(Math.abs(m)%60)}

/* ---------- Zustand ---------- */
const S={view:"posten",posts:[],insights:[],pool:[],poolSel:null,planSel:null,poolBusy:0,loaded:false,mode:"lokal",
  draft:null,cur:0,blobs:{},suggest:null,suggesting:false,confirm:false,sending:false,
  weekStart:null,chartMetric:"followers",mc:{state:"checking",brandId:BRAND_FALLBACK,tz:"Europe/Berlin",msg:""},live:null,media:[],aTab:"ueberblick",aPer:"d30",mSort:"neu",calc:{post:"",views:"",likes:"",comments:"",shares:"",saves:""}};
function monday(d){const x=new Date(d);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);x.setHours(12,0,0,0);return x}
S.weekStart=monday(new Date());

S.draft=newDraft();

/* ---------- Speicher: db, sonst lokal ---------- */
let db=null,assets=null,sample=null,mcp=null;
const LS="sg-studio-local";
function lsLoad(){try{const o=JSON.parse(localStorage.getItem(LS)||"{}");S.posts=o.posts||[];S.insights=o.insights||[]}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({posts:S.posts,insights:S.insights}))}catch(e){}}
async function savePost(p){p.updatedAt=new Date().toISOString();const clean=JSON.parse(JSON.stringify(p,(k,v)=>k==="local"?undefined:v));
  if(db){await db.collection("posts").doc(p.id).set(clean)}else{const i=S.posts.findIndex(x=>x.id===p.id);if(i>=0)S.posts[i]=clean;else S.posts.push(clean);lsSave();render()}}
async function deletePost(id){if(db){await db.collection("posts").doc(id).delete()}else{S.posts=S.posts.filter(p=>p.id!==id);lsSave();render()}}
async function saveInsight(i){if(db){await db.collection("insights").doc(i.date).set(i)}else{S.insights=S.insights.filter(x=>x.date!==i.date);S.insights.push(i);lsSave();render()}}

function route(){let h=location.hash.slice(1);const mm=decodeURIComponent(h).match(/^analytics(?:\/m\/|-)(\d+)$/);if(mm){S.pendingMO=mm[1];h="analytics"}if(h==="zahlen")h="analytics";const prev=S.view;S.view=VIEWS.includes(h)?h:"posten";
  document.querySelectorAll("nav.side a[data-v]").forEach(a=>{if(a.dataset.v===S.view)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  document.getElementById("ptitle").textContent=TITLES[S.view];render();if(prev!==S.view)scrollTo({top:0})}

function mcInfo(){const map={checking:["var(--muted)","Metricool wird geprüft …"],ok:["var(--ok)","Metricool verbunden"],nonet:["var(--warn)","Instagram in Metricool noch nicht verbunden"],off:["var(--muted)","Metricool hier nicht verfügbar"],auth:["var(--bad)","Metricool neu verbinden"]};return map[S.mc.state]||map.off}

function checks(d){const all=(d.caption+" "+d.tags);const n=countTags(all);const isV=d.format==="REEL"||d.format==="STORY";
  const ratioOk=d.images.length?d.images.every(im=>!im.ratio||Math.abs(im.ratio-(isV?0.5625:0.8))<0.02):null;
  return [
    ["Ort gesetzt",!!d.ort.trim()],
    [n+" Hashtags (max. 5)",n<=5],
    ["Keine Frage am Ende",!/\?\s*$/.test(d.caption.trim())],
    [isV?"Format 9:16":"Format 4:5",ratioOk],
    [(d.caption.length+(d.tags?d.tags.length+2:0))+" / 2.200 Zeichen",d.caption.length+(d.tags?d.tags.length+2:0)<=2200]
  ]}
function nextSlots(){const out=[];const taken=new Set(S.posts.filter(p=>p.date&&p.status!=="entwurf").map(p=>p.date));const now=new Date();const nowHM=pad(now.getHours())+":"+pad(now.getMinutes());const d=new Date();d.setHours(12);
  for(let i=0;i<14&&out.length<3;i++){const x=new Date(d);x.setDate(d.getDate()+i);const t=SLOTS[x.getDay()];if(i===0&&t&&t<=nowHM)continue;if(t&&!taken.has(iso(x)))out.push([iso(x),t])}return out}

async function addFiles(files){
  for(const f of files){
    if(!/^(image|video)\//.test(f.type))continue;
    const local=URL.createObjectURL(f);const im={local,type:f.type,ratio:null,name:f.name};
    if(f.type.startsWith("image/")){await new Promise(r=>{const i=new Image();i.onload=()=>{im.ratio=i.naturalWidth/i.naturalHeight;r()};i.onerror=r;i.src=local})}
    else{await new Promise(r=>{const v=document.createElement("video");v.onloadedmetadata=()=>{im.ratio=v.videoWidth/v.videoHeight;r()};v.onerror=r;v.src=local})}
    S.draft.images.push(im);
    S.blobs[local]=f;
    if(assets){im.up=assets.upload(f).then(res=>{im.id=res.id;im.url=res.url}).catch(e=>{toast(e&&e.code==="too_large"?"Datei zu groß für den Speicher (max. 20 MB)":"Bild konnte nicht gespeichert werden")})}
  }
  if(S.draft.images.length>1&&S.draft.format==="POST")S.draft.format="KARUSSELL";
  if(S.draft.images.some(i=>(i.type||"").startsWith("video"))&&S.draft.format!=="STORY")S.draft.format="REEL";
  S.cur=S.draft.images.length-1;render();
}
async function commit(status){
  syncDraftFromInputs();const d=S.draft;
  const ups=d.images.map(i=>i.up).filter(u=>u&&typeof u.then==="function");
  if(ups.length&&d.images.some(i=>i.local&&!i.id)){toast("Bilder werden noch hochgeladen …");await Promise.allSettled(ups)}
  const usedPool=d.images.map(i=>i.poolId).filter(Boolean);
  const p={...d,id:d.id||uid(),status,images:d.images.map(i=>({id:i.id||null,url:i.id?null:(i.url||null),type:i.type||"image/jpeg",ratio:i.ratio||null})).filter(i=>i.id||i.url)};
  if(!assets)p.images=[];
  try{await savePost(p);S.draft={...p,images:d.images.map(i=>{const c={...i};delete c.poolId;return c})};
    if(db)for(const pid of usedPool){db.collection("pool").doc(pid).delete().catch(()=>{})}toast(status==="entwurf"?"Entwurf gespeichert":status==="geplant"?"Eingeplant für "+fmtD(p.date)+" "+p.time:status==="metricool"?"Gespeichert":"Gespeichert, im Raster als veröffentlicht");render()}
  catch(e){toast(e&&e.code==="quota_exceeded"?"Speicher voll, bitte alte Posts löschen":"Speichern hat nicht geklappt")}
}
function editPost(id){const p=S.posts.find(x=>x.id===id);if(!p)return;S.draft=JSON.parse(JSON.stringify({...newDraft(),...p}));S.cur=0;S.suggest=null;S.confirm=false;location.hash="posten";render();scrollTo({top:0})}

/* Caption-Vorschlag über Claude */
async function suggestCaption(){
  syncDraftFromInputs();if(!sample||S.suggesting)return;const d=S.draft;
  S.suggesting=true;S.suggest=null;render();
  const prompt=`Du schreibst Instagram-Bildunterschriften für Bruno, Hobbyfotograf aus Bochum. Account sommer_gram: Reisen, Natur, Urban Photography.
Ton: Fotograf, nicht Influencer. Deutsch, kurz, beobachtend, trocken oder erzählerisch. 1 bis 2 Sätze, gern auch nur wenige Wörter.
Schreib so, wie Bruno es selbst ins Handy tippen würde: alltägliche Wörter, gern trocken oder mit leisem Humor. Seinen Sohn nennt er „der kleine Mann" oder „der Knirps". Erlaubt ist ein englisches Stichwort vorne mit Strich, z. B. „Sunday |", das ist aber kein Muss.
Verboten: Fragen, Aufrufe zur Interaktion („Was meint ihr", „Markiere"), Gedankenstriche, Superlative, mehr als ein Emoji, Werbe- oder Prospektton, Aufzählungen zu dritt, das Muster „nicht X, sondern Y", aufgeblasene Bedeutung („ein besonderer Moment", „Magie"), gespielte Lockerheit, Floskeln wie perfekt für, ideal für, zeitlos, Klassiker, Hingucker, Begleiter, für jeden Anlass, und KI-Wörter wie eintauchen, Zauber, unterstreichen, Landschaft im übertragenen Sinn.
Die drei Vorschläge sollen unterschiedlich gebaut sein: einer nur ein paar Wörter, einer mit Ort, einer als kleine Beobachtung.
Erfinde keinen Ort, keine Personen und keine Details, die weder auf dem Bild zu sehen sind noch unten stehen.
Beispiele seines Tons: „Abendessen" · „Der Frühling kommt" · „Die Sonnenuntergänge sind auch ganz okay hier" · „Anflug über dem Cap Formentor. Das Blau sieht aus, als wäre es extra angemischt worden." · „Heimweg. Mein Junge hat die bessere Aussicht."
Angaben: Format ${FORMATS[d.format]}. Ort: ${d.ort||"nicht angegeben, dann keinen Ort nennen"}. Titel/Notiz: ${d.title||"–"}. Bisheriger Entwurf: ${d.caption||"–"}.
Antworte nur als JSON: {"vorschlaege":["…","…","…"],"hashtags":"#… #… #…"} mit drei Vorschlägen und zwei bis drei Hashtags (zum Ort und zum Motiv; ohne Ort keinen Orts-Hashtag).`;
  try{
    const opts={modelTier:"default"};
    try{const lim=await sample.limits();if(lim.images){const blobs=[];for(const im of d.images.slice(0,Math.min(3,lim.images.maxCount))){if((im.type||"").startsWith("video"))continue;let b=im.local&&S.blobs[im.local];if(!b&&im.id){try{b=await (await fetch("/_blob/"+im.id)).blob()}catch(e){}}if(b&&b.size<=lim.images.maxInputBytes&&lim.images.mediaTypes.includes(b.type))blobs.push(b)}if(blobs.length)opts.images=blobs}}catch(e){}
    const r=await sample.json(prompt,opts);
    const v=(r&&Array.isArray(r.vorschlaege)?r.vorschlaege:[]).filter(x=>typeof x==="string").slice(0,3);
    S.suggest=v.length?{v,h:typeof r.hashtags==="string"?r.hashtags:""}:{err:"Kein Vorschlag gekommen. Versuch es noch einmal."};
  }catch(e){S.suggest={err:e&&e.code==="not_granted"?"Vorschläge brauchen deine Freigabe für dieses Studio.":e&&e.code==="rate_limited"?"Gerade zu viele Anfragen. Gleich noch einmal probieren.":"Vorschlag hat nicht geklappt."}}
  S.suggesting=false;render();
}

async function sendToMetricool(){
  syncDraftFromInputs();const d=S.draft;if(!mcp||S.sending)return;S.sending=true;render();
  const media=d.mediaUrl.split(/\s+/).map(s=>s.trim()).filter(Boolean);
  const type=d.format==="REEL"?"REEL":d.format==="STORY"?"STORY":"POST";
  const text=type==="STORY"?"":(d.caption+(d.tags?"\n\n"+d.tags:""));
  const info={autoPublish:true,draft:false,descendants:[],firstCommentText:"",hasNotReadNotes:false,media,mediaAltText:[],
    providers:[{network:"instagram"}],publicationDate:{dateTime:`${d.date}T${d.time}:00`,timezone:S.mc.tz},shortener:false,smartLinkData:{ids:[]},text,
    instagramData:{type,showReelOnFeed:true,isAiGenerated:false}};
  try{
    const res=await mcp.callTool(MC,"createScheduledPost",{blogId:S.mc.brandId,date:`${d.date}T${d.time}:00${tzOffset(d.date,d.time)}`,info:JSON.stringify(info)});
    const url=findKey(res.payload,"plannerUrl");
    S.draft.plannerUrl=typeof url==="string"?url:"";S.confirm=false;S.sending=false;await commit("metricool");toast("Bei Metricool eingeplant");
  }catch(e){S.sending=false;S.confirm=false;
    const m={tool_error:"Metricool hat abgelehnt: "+(e.message||"").slice(0,200),needs_reauth:"Metricool in claude.ai unter Einstellungen → Konnektoren neu verbinden.",server_not_connected:"Metricool ist für dich nicht als Konnektor verbunden.",not_in_manifest:"Metricool ist für dieses Studio nicht freigegeben.",approval_required:"Das Senden braucht deine Freigabe. Bitte noch einmal tippen.",server_unavailable:"Metricool antwortet gerade nicht. Prüf in Metricool, ob der Post trotzdem angekommen ist, bevor du neu sendest.",upstream_error:"Unklar, ob der Post angekommen ist. Bitte erst in Metricool nachsehen."};
    showError(m[e&&e.code]||"Senden hat nicht geklappt ("+(e&&e.code||"unbekannt")+").");render()}
}
function findKey(o,k,depth=0){if(!o||typeof o!=="object"||depth>6)return null;if(k in o)return o[k];for(const v of Object.values(o)){const r=findKey(v,k,depth+1);if(r!=null)return r}return null}
function showError(t){const b=document.getElementById("banner");b.innerHTML=`<div class="notice bad">${esc(t)}</div>`;setTimeout(()=>{if(b.firstChild&&b.firstChild.classList.contains("bad"))renderBanner()},9000)}

function lineChart(pts,label){
  const W=1000,H=280,L=56,R=16,T=16,B=30;
  if(!pts.length)return `<p class="muted small">Noch keine Werte. Trag unten deine Zahlen aus den Insights ein, am besten jeden Sonntag. Dann wächst hier dein Verlauf.</p>`;
  const xs=pts.map(p=>parse(p.date).getTime());const ys=pts.map(p=>p.v);
  let x0=Math.min(...xs),x1=Math.max(...xs);if(x0===x1){x0-=3*864e5;x1+=3*864e5}
  let y0=Math.min(...ys),y1=Math.max(...ys);const padY=Math.max((y1-y0)*.15,y1*.02,1);y0=Math.max(0,y0-padY);y1=y1+padY;
  const sx=x=>L+(x-x0)/(x1-x0)*(W-L-R),sy=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
  const ticks=[0,1,2,3].map(i=>y0+(y1-y0)*i/3);
  const line=pts.map((p,i)=>(i?"L":"M")+sx(xs[i]).toFixed(1)+" "+sy(p.v).toFixed(1)).join(" ");
  const area=line+` L${sx(xs[xs.length-1]).toFixed(1)} ${H-B} L${sx(xs[0]).toFixed(1)} ${H-B} Z`;
  const last=pts[pts.length-1];
  const xl=pts.length<=8?pts:pts.filter((_,i)=>i%Math.ceil(pts.length/6)===0||i===pts.length-1);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)} im Verlauf">
    ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${sy(t)}" y2="${sy(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${sy(t)+4}" text-anchor="end">${nf(Math.round(t))}</text>`).join("")}
    <path d="${area}" fill="var(--accent-fill)"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${sx(xs[i])}" cy="${sy(p.v)}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?"var(--accent)":"var(--card)"}" stroke="var(--accent)" stroke-width="2"><title>${fmtD(p.date)}: ${nf(p.v)}</title></circle>`).join("")}
    <text x="${Math.min(sx(xs[xs.length-1]),W-R-4)}" y="${sy(last.v)-12}" text-anchor="end" style="fill:var(--text);font-weight:700">${nf(last.v)}</text>
    ${xl.map(p=>`<text x="${sx(parse(p.date).getTime())}" y="${H-8}" text-anchor="middle">${pad(parse(p.date).getDate())}.${pad(parse(p.date).getMonth()+1)}.</text>`).join("")}
  </svg>`}

function vHistory(){const ins=[...S.insights].sort((a,b)=>a.date.localeCompare(b.date));const last=ins[ins.length-1];
  const key=S.chartMetric;const pts=ins.filter(i=>i[key]!=null).map(i=>({date:i.date,v:+i[key]}));
  return `<section class="card chart">
    <div class="cardhead"><h2>Verlauf</h2><div class="tabs" role="group" aria-label="Kennzahl"><a href="javascript:void 0" data-m="followers" ${key==="followers"?'aria-current="page"':""}>Follower</a><a href="javascript:void 0" data-m="views30" ${key==="views30"?'aria-current="page"':""}>Aufrufe 30 Tage</a></div></div>
    ${lineChart(pts,key==="followers"?"Follower":"Aufrufe 30 Tage")}
    <p class="small muted" style="margin:10px 0 0">Jeder Morgen-Check setzt einen Punkt. Nach ein paar Wochen siehst du hier, wie sich der Account entwickelt.</p>
    <details style="margin-top:12px"><summary class="small">Zahlen von Hand nachtragen</summary>
    <form id="insForm" class="row" style="margin-top:12px;align-items:flex-end">
      <label class="stack" style="flex:1 1 140px"><span class="lbl">Datum</span><input class="field" type="date" id="i-date" value="${iso(new Date())}" required></label>
      <label class="stack" style="flex:1 1 140px"><span class="lbl">Follower</span><input class="field" type="number" min="0" inputmode="numeric" id="i-f" placeholder="${last&&last.followers!=null?last.followers:""}"></label>
      <label class="stack" style="flex:1 1 160px"><span class="lbl">Aufrufe, 30 Tage</span><input class="field" type="number" min="0" inputmode="numeric" id="i-v" placeholder="${last&&last.views30!=null?last.views30:""}"></label>
      <button class="btn" type="submit">Eintragen</button>
    </form></details>
  </section>`}
function liveHTML(){const m=S.mc;
  if(m.state==="nonet")return `<h2>Live aus Metricool</h2><p class="small muted" style="margin-top:8px">Metricool ist verbunden, aber sommer_gram noch nicht. Metricool braucht dafür ein Creator- oder Business-Konto bei Instagram. Danach kommen Follower, Aufrufe und Reichweite hier automatisch rein.</p><a class="small" href="https://app.metricool.com/brands/connections?blogId=${esc(m.brandId)}" target="_blank" rel="noopener">Instagram in Metricool verbinden</a>`;
  if(m.state!=="ok")return `<h2>Live aus Metricool</h2><p class="small muted" style="margin-top:8px">${m.state==="checking"?"Verbindung wird geprüft …":m.state==="auth"?"Metricool in claude.ai unter Einstellungen → Konnektoren neu verbinden.":"Live-Zahlen gehen nur, wenn du das Studio in claude.ai geöffnet hast und Metricool verbunden ist. Bis dahin zählen deine eingetragenen Werte."}</p>`;
  const L=S.live;
  return `<div class="cardhead"><h2>Live aus Metricool</h2><button class="btn ghost sm" id="liveLoad">${L&&L.loading?"Lädt …":"Letzte 30 Tage laden"}</button></div>
  ${!L?`<p class="small muted">Holt Follower, Aufrufe, Reichweite und Interaktionen der letzten 30 Tage.</p>`:L.err?`<div class="notice bad">${esc(L.err)}</div>`:L.vals?`<div class="kpis">${L.vals.map(([k,v])=>`<div class="kpi"><span class="s">${esc(k)}</span><span class="v">${nf(v)}</span></div>`).join("")}</div>${L.vals.every(v=>!v[1])?`<p class="small muted">Alles noch 0. Nach dem Verbinden holt Metricool die Daten erst nach, das kann bis zu einem Tag dauern.</p>`:`<div class="row" style="margin-top:12px"><button class="btn ghost sm" id="liveTake">Follower als heutigen Stand übernehmen</button>${L.storedAt?`<span class="small muted">Stand ${new Date(L.storedAt).toLocaleString("de-DE")}</span>`:""}</div>`}`:L.raw?`<p class="small muted">Antwort erhalten, aber in einem Format, das das Studio noch nicht kennt. Sag Claude Bescheid, dann wird es angepasst.</p><pre class="raw">${esc(L.raw)}</pre>`:""}`}
const LIVE_METRICS=[["IGEV01","Follower"],["IGEV05","Aufrufe"],["IGEV06","Reichweite"],["IGEV38","Interaktionen"]];
async function loadLive(){if(!mcp)return;S.live={loading:true};render();
  const to=new Date(),from=new Date();from.setDate(to.getDate()-30);
  const off=tzOffset(iso(to),"12:00");
  try{const r=await mcp.callTool(MC,"getAnalyticsDataByMetrics",{brandId:S.mc.brandId,from:iso(from)+"T00:00:00"+off,to:iso(to)+"T23:59:59"+off,metrics:LIVE_METRICS.map(m=>m[0])});
    const p=r.payload;const vals=[];
    // Metricool liefert {rows:[[wert1, wert2, …, "JJJJMMTT"]]} in der Reihenfolge der angefragten Kennzahlen
    const rows=p&&Array.isArray(p.rows)?p.rows:null;
    if(rows&&rows.length){const row=rows[rows.length-1];LIVE_METRICS.forEach(([id,label],i)=>{const v=parseFloat(row[i]);if(!isNaN(v))vals.push([label,v])})}
    S.live=vals.length?{vals,storedAt:r.cache&&r.cache.storedAt}:{raw:JSON.stringify(p,null,1).slice(0,3000)};
  }catch(e){S.live={err:e&&e.code==="tool_error"?"Metricool meldet: "+(e.message||"").slice(0,240):e&&e.code==="needs_reauth"?"Metricool in claude.ai unter Einstellungen → Konnektoren neu verbinden.":e&&e.code==="server_unavailable"?"Metricool antwortet gerade nicht. Später noch einmal laden.":"Laden hat nicht geklappt ("+(e&&e.code||"unbekannt")+")."}}
  render()}

/* ---------- Start ---------- */
/* Großansicht */
let lbEl=null,lbIdx=0;
function openLB(i){const ims=S.draft.images.filter(x=>!(x.type||"").startsWith("video"));if(!ims.length)return;lbIdx=Math.max(0,Math.min(i,ims.length-1));
  if(!lbEl){lbEl=document.createElement("div");lbEl.className="lb";lbEl.setAttribute("role","dialog");lbEl.setAttribute("aria-label","Foto groß");document.body.appendChild(lbEl);
    lbEl.addEventListener("click",e=>{const t=e.target.closest("button");if(!t){closeLB();return}if(t.classList.contains("lbx"))closeLB();else if(t.classList.contains("lbp"))stepLB(-1);else if(t.classList.contains("lbn"))stepLB(1)});
    document.addEventListener("keydown",e=>{if(!lbEl||lbEl.hidden)return;if(e.key==="Escape")closeLB();else if(e.key==="ArrowLeft")stepLB(-1);else if(e.key==="ArrowRight")stepLB(1)});
    let sx=null;lbEl.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});lbEl.addEventListener("touchend",e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)stepLB(dx<0?1:-1);sx=null})}
  lbEl.hidden=false;drawLB();flipLB(true)}
const noMotion=()=>{try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}};
function srcRect(){const d=document.querySelector("#drop img");return d?d.getBoundingClientRect():null}
let lbTok=0;
async function flipLB(opening){const tok=++lbTok;const img=lbEl.querySelector("img");const from=srcRect();
  if(noMotion()||!img||!img.animate){if(!opening){lbEl.hidden=true;lbEl.innerHTML=""}return}
  const ctrls=[...lbEl.querySelectorAll("button,.lbc")];
  if(opening){
    img.style.visibility="hidden";ctrls.forEach(c=>c.style.opacity="0");
    lbEl.animate([{backgroundColor:"rgba(10,10,10,0)",backdropFilter:"blur(0px)"},{backgroundColor:"rgba(10,10,10,.92)",backdropFilter:"blur(14px)"}],{duration:420,easing:"cubic-bezier(.4,0,.2,1)"});
    if(!(img.complete&&img.naturalWidth)){try{await Promise.race([img.decode(),new Promise(r=>setTimeout(r,150))])}catch(e){}}
    await new Promise(r=>requestAnimationFrame(r));
    if(tok!==lbTok||lbEl.hidden){img.style.visibility="";return}
  }
  const to=img.getBoundingClientRect();
  let a="scale(.82)",o0=0;
  if(from&&to.width){const sc=Math.max(from.width/to.width,from.height/to.height);a=`translate(${(from.left+from.width/2)-(to.left+to.width/2)}px,${(from.top+from.height/2)-(to.top+to.height/2)}px) scale(${sc})`;o0=1}
  if(opening){
    img.style.visibility="";
    img.animate([
      {transform:a,opacity:o0,borderRadius:"18px",easing:"cubic-bezier(.16,1,.3,1)"},
      {transform:"scale(1.012)",opacity:1,borderRadius:"8px",offset:.78,easing:"cubic-bezier(.45,0,.55,1)"},
      {transform:"none",opacity:1,borderRadius:"6px"}],{duration:640});
    ctrls.forEach((c,i)=>{c.style.opacity="";c.animate([{opacity:0},{opacity:1}],{duration:260,delay:420+i*30,fill:"backwards",easing:"ease-out"})});
  }else{
    img.style.visibility="";img.getAnimations().forEach(x=>x.cancel());lbEl.getAnimations().forEach(x=>x.cancel());
    ctrls.forEach(c=>c.animate([{opacity:1},{opacity:0}],{duration:140,fill:"forwards"}));
    lbEl.animate([{backgroundColor:"rgba(10,10,10,.92)",backdropFilter:"blur(14px)"},{backgroundColor:"rgba(10,10,10,0)",backdropFilter:"blur(0px)"}],{duration:380,easing:"cubic-bezier(.4,0,.2,1)",fill:"forwards"});
    const an=img.animate([{transform:"none",opacity:1,borderRadius:"6px"},{transform:a,opacity:o0,borderRadius:"18px"}],{duration:420,easing:"cubic-bezier(.4,0,.2,1)",fill:"forwards"});
    an.onfinish=()=>{lbEl.hidden=true;lbEl.innerHTML="";lbEl.getAnimations().forEach(x=>x.cancel())};
  }}
function drawLB(){const ims=S.draft.images.filter(x=>!(x.type||"").startsWith("video"));const n=ims.length;
  lbEl.innerHTML=`<img src="${esc(imgSrc(ims[lbIdx]))}" alt="Foto ${lbIdx+1} von ${n}"><button class="lbx" aria-label="Schließen">✕</button>${n>1?`<button class="lbp" aria-label="Vorheriges Foto">‹</button><button class="lbn" aria-label="Nächstes Foto">›</button><span class="lbc">${lbIdx+1} / ${n}</span>`:""}`;
  const im=lbEl.querySelector("img");sizeLB(im,ims[lbIdx].ratio||0.8);im.addEventListener("load",()=>{if(im.naturalWidth)sizeLB(im,im.naturalWidth/im.naturalHeight)},{once:true});
  lbEl.querySelector(".lbx").focus()}
function sizeLB(im,r){if(!im)return;const cs=getComputedStyle(lbEl);const aw=lbEl.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);const ah=lbEl.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  let w=Math.min(aw,ah*r);let h=w/r;im.style.width=Math.round(w)+"px";im.style.height=Math.round(h)+"px";im.dataset.r=r}
addEventListener("resize",()=>{if(lbEl&&!lbEl.hidden){const im=lbEl.querySelector("img");if(im)sizeLB(im,+im.dataset.r||0.8)}});
function stepLB(d){const n=S.draft.images.filter(x=>!(x.type||"").startsWith("video")).length;if(n<2)return;lbIdx=(lbIdx+d+n)%n;drawLB();
  const img=lbEl.querySelector("img");if(img&&img.animate&&!noMotion())img.animate([{transform:`translateX(${d*40}px)`,opacity:0},{transform:"none",opacity:1}],{duration:260,easing:"cubic-bezier(.2,.8,.2,1)"})}
let lbClosing=false;
function closeLB(){if(!lbEl||lbEl.hidden||lbClosing)return;lbClosing=true;
  flipLB(false);setTimeout(()=>{lbClosing=false;if(lbEl&&!lbEl.hidden&&!lbEl.getAnimations().some(x=>x.playState==="running")){lbEl.hidden=true;lbEl.innerHTML="";if(lbEl.getAnimations)lbEl.getAnimations().forEach(x=>x.cancel())}},520)}
try{S.gorder=JSON.parse(localStorage.getItem("sg-gorder")||"[]")}catch(e){S.gorder=[]}
lsLoad();try{route()}catch(e){console.error(e)}
addEventListener("scroll",()=>{document.body.classList.toggle("sc",scrollY>60)},{passive:true});
(async()=>{
  if(!window.claude||!window.claude.use){S.loaded=true;S.mc.state="off";render();return}
  const timer=setTimeout(()=>{if(!S.loaded){S.loaded=true;render()}},10000);
  db=await claude.use("db");
  if(db){S.mode="sync";
    db.collection("posts").onSnapshot(snap=>{S.posts=snap.docs.map(d=>({...d.data(),id:d.id}));S.loaded=true;clearTimeout(timer);render()},e=>{S.loaded=true;if(e.code==="revoked"||e.code==="not_granted"){db=null;S.mode="lokal";lsLoad()}render()});
    db.collection("insights").onSnapshot(snap=>{S.insights=snap.docs.map(d=>d.data());render()},()=>{});
    db.collection("ig_media").onSnapshot(snap=>{S.media=snap.docs.map(d=>({...d.data(),id:d.id})).filter(m=>m.ts);render()},()=>{});
    db.collection("gallery").onSnapshot(snap=>{const d=snap.docs.find(x=>x.id==="order");S.gorder=d&&d.data().keys||[];render()},()=>{});
    db.collection("pool").onSnapshot(snap=>{S.pool=snap.docs.map(d=>({...d.data(),id:d.id})).filter(x=>x.img&&x.img.id).sort((a,b)=>(b.addedAt||"").localeCompare(a.addedAt||""));if(S.poolSel&&!S.pool.some(x=>x.id===S.poolSel))S.poolSel=null;render()},()=>{});
  }else{S.loaded=true;clearTimeout(timer)}
  claude.use("assets").then(a=>{assets=a;render()});
  claude.use("sample").then(s=>{sample=s;render()});
  mcp=await claude.use("mcp");
  if(!mcp){S.mc.state="off";render();return}
  try{const r=await mcp.callTool(MC,"getBrandSettings",{},{cache:{staleTime:300000,gcTime:600000}});
    const p=r.payload;const b=Array.isArray(p)?p[0]:(p&&(p.brands?p.brands[0]:p));
    const id=b&&(b.blogId??b.id??b.brandId);if(id!=null)S.mc.brandId=String(id);
    const tz=b&&(b.timezone||b.timeZone);if(typeof tz==="string")S.mc.tz=tz;
  }catch(e){const m=(e&&e.message||"").match(/blogId=(\d+)/);if(m)S.mc.brandId=m[1];if(e&&e.code==="needs_reauth"){S.mc.state="auth";render();return}}
  // Verbindung zu Instagram über eine kleine Analytics-Abfrage prüfen
  try{const t=iso(new Date()),off=tzOffset(t,"12:00");
    await mcp.callTool(MC,"getAnalyticsDataByMetrics",{brandId:S.mc.brandId,from:t+"T00:00:00"+off,to:t+"T23:59:59"+off,metrics:["IGEV01"]},{cache:{staleTime:600000,gcTime:900000}});
    S.mc.state="ok";
  }catch(e){const c=e&&e.code;S.mc.msg=e&&e.message||"";
    S.mc.state=c==="tool_error"?"nonet":c==="needs_reauth"?"auth":"off"}
  render();
})();
</script>
