*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:400 15px/1.45 var(--sans);padding-left:calc(var(--side-w) + env(safe-area-inset-left,0px));-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.wrap{max-width:1240px;margin:0 auto;padding-block:28px 64px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-size:34px;line-height:1.05;font-weight:600;letter-spacing:-.035em;margin:0;text-wrap:balance}
a.home{color:inherit;text-decoration:none;cursor:pointer;border-radius:8px}
a.home:hover{opacity:.75}
h2{font-size:18px;font-weight:600;letter-spacing:-.02em;margin:0}
.sub{display:flex;align-items:center;gap:10px;margin-top:0;color:var(--text-2);font-size:13px;flex-wrap:wrap}

.conn{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);background:var(--field);border-radius:999px;padding:6px 12px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.tabs{display:inline-flex;background:var(--field);border-radius:999px;padding:4px;gap:2px}
.tabs a{padding:8px 18px;border-radius:999px;text-decoration:none;color:var(--text-2);font-weight:600;font-size:14px}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--on-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:24px;min-width:0}
.card>h2+*{margin-top:16px}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
.muted{color:var(--text-2)}
.small{font-size:13px}
.field{width:100%;background:var(--field);border:1px solid transparent;border-radius:var(--r-field);padding:11px 14px;outline:none}
.field:focus{border-color:var(--text-3);background:var(--card)}
textarea.field{resize:vertical;min-height:130px;line-height:1.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.stack{display:flex;flex-direction:column;gap:6px;min-width:0}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;min-height:36px}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.pill:hover{border-color:var(--text-3)}
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:600;cursor:pointer;background:var(--sun);color:var(--on-amber);min-height:42px;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:var(--field);color:var(--text)}
.btn.soft{background:var(--peach);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:7px 14px;min-height:34px;font-size:13px}
.linkish{background:none;border:0;padding:0;color:var(--text-2);text-decoration:underline;cursor:pointer;font-size:13px;min-height:24px}
.notice{border-radius:16px;padding:12px 16px;background:var(--peach-soft);border:1px solid var(--peach);font-size:14px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.notice.bad{background:transparent;border-color:var(--bad)}


.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2);white-space:nowrap}

/* Analytics */
.chart svg{width:100%;height:auto;display:block}
.chart text{font-size:11px;fill:var(--text-3);font-family:var(--sans)}
details summary{cursor:pointer;color:var(--text-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--on-ink);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:50}

@media (max-width:560px){
  h1{font-size:30px}

  .grid2{grid-template-columns:minmax(0,1fr)}

}

/* iPad-App */
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,a,.pill,.thumb,.ev,.slot,.tile,[role=button],label.btn,tr.click{touch-action:manipulation}

body.sc header.top{padding-bottom:8px}

label.btn{cursor:pointer}
.btn:active,.pill:active,.ev:active,.slot:active,.tabs a:active{transform:scale(.97)}
@media (pointer:coarse){

}

/* Seitenleiste */
nav.side{position:fixed;left:0;top:0;bottom:0;z-index:45;width:calc(var(--side-w) + env(safe-area-inset-left,0px));padding:calc(22px + env(safe-area-inset-top,0px)) 0 calc(18px + env(safe-area-inset-bottom,0px)) env(safe-area-inset-left,0px);background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px}

/* Oben statt links: Leiste mit Text (ab 701 px) */

}

/* Einstellungen */
.setgrid{display:grid;gap:22px;max-width:860px}
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.themeopt{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer;color:inherit;font:inherit;min-width:0}
.themeopt[aria-pressed="true"]{border-color:var(--amber);box-shadow:0 0 0 3px var(--accent-fill)}

.tprev{display:block;aspect-ratio:16/10;max-width:100%;border-radius:10px;position:relative;overflow:hidden;border:1px solid var(--line)}
.tprev.light{background:#F7EFE4}.tprev.dark{background:#1E1B19}.tprev.auto{background:linear-gradient(120deg,#F7EFE4 50%,#1E1B19 50%)}
.tprev i{position:absolute;display:block;border-radius:4px}
.tprev i:nth-child(1){left:0;top:0;bottom:0;width:16%;background:rgba(128,120,110,.28)}
.tprev i:nth-child(2){left:24%;top:16%;width:30%;height:66%;background:#9C8F7A}

.setrow{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--line);align-items:center}

.pill[aria-pressed="true"]{background:var(--amber);color:var(--on-amber);border-color:var(--amber)}

<script>
/* Web-App: Speicher und Bilder kommen aus studio-firebase.js (Firebase) statt aus Claude. */
(function(){
  var res,p=new Promise(function(r){res=r;});window.__studioResolve=res;window.__STUDIO_APP=true;window.__studioApi=p;
  window.claude={use:function(n){return p.then(function(api){return api[n]||null;});}};
  var T="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7",cache=new Map(),pend=new Set();
  window.__bildSet=function(id,url){cache.set(id,url);};
  window.__bild=function(id){var u=cache.get(id);if(u)return u;if(!pend.has(id)){pend.add(id);
    p.then(function(api){return api.loadBild(id);}).then(function(url){if(!url)return;cache.set(id,url);
      document.querySelectorAll('img[src$="#bid='+id+'"]').forEach(function(i){i.src=url;});}).catch(function(){}).then(function(){pend.delete(id);});}
    return T+"#bid="+id;};
  if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
})();
</script>
<script type="module" src="studio-firebase.js"></script>
<script>
/* ---------- Grundlagen ---------- */
/* Studio ab 21.11.2026: Archiv, Werkstatt, Zahlen. Geplant und gepostet wird im Claude-Chat, hier wird nur gezeigt, was online ist. */
const FORMATS={POST:"Foto",KARUSSELL:"Karussell",REEL:"Reel",STORY:"Story"};
const TYPE_L={POST:"Beitrag",KARUSSELL:"Karussell",REEL:"Reel",STORY:"Story"};
const MTYPE_L={Bild:"Beitrag",Karussell:"Karussell",Reel:"Reel",Story:"Story"};
const WD=["So","Mo","Di","Mi","Do","Fr","Sa"];
const WDL=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=n=>n==null||n===""||isNaN(n)?"–":Number(n).toLocaleString("de-DE");
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>new Date(s+"T12:00:00");
const fmtD=s=>{if(!s)return "ohne Datum";const d=parse(s);return WD[d.getDay()]+", "+pad(d.getDate())+"."+pad(d.getMonth()+1)+"."};
const dShort=s=>{if(!s)return "";const d=parse(s);return pad(d.getDate())+"."+pad(d.getMonth()+1)+"."};
const imgSrc=im=>{if(!im)return "";if(im.local)return im.local;const id=im.id||((im.url||"").match(/_blob\/([^/?#]+)/)||[])[1];if(window.__bild&&id)return window.__bild(id);return im.url||(id?"/_blob/"+id:"")};
const noMotion=()=>{try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}};
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}
function puFirstImg(p){return p&&p.images?p.images.find(x=>!(x.type||"").startsWith("video"))||p.images[0]||null:null}
function stillImg(p){return p&&p.images?p.images.find(x=>!(x.type||"").startsWith("video"))||null:null}

/* ---------- Zustand ---------- */
const S={view:"archiv",posts:[],insights:[],media:[],loaded:false,mode:"lokal",chartMetric:"followers",aPer:"d30",aSort:"views"};

/* ---------- Speicher: db, sonst lokal ---------- */
let db=null,assets=null;
const LS="sg-studio-local";
function lsLoad(){try{const o=JSON.parse(localStorage.getItem(LS)||"{}");S.posts=o.posts||[];S.insights=o.insights||[]}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({posts:S.posts,insights:S.insights}))}catch(e){}}
async function savePost(p){p.updatedAt=new Date().toISOString();const clean=JSON.parse(JSON.stringify(p,(k,v)=>k==="local"?undefined:v));
  if(db){await db.collection("posts").doc(p.id).set(clean)}else{const i=S.posts.findIndex(x=>x.id===p.id);if(i>=0)S.posts[i]=clean;else S.posts.push(clean);lsSave();render()}}
async function saveInsight(i){if(db){await db.collection("insights").doc(i.date).set(i)}else{S.insights=S.insights.filter(x=>x.date!==i.date);S.insights.push(i);lsSave();render()}}

/* ---------- Navigation ---------- */
const VIEWS=["archiv","analytics","einstellungen"];
const TITLES={archiv:"Archiv",analytics:"Zahlen",einstellungen:"Einstellungen"};
function route(){let h=decodeURIComponent(location.hash.slice(1));const mm=h.match(/^analytics(?:\/m\/|-)(\d+)$/);if(mm){S.pendingMO=mm[1];h="analytics"}
  if(h==="zahlen")h="analytics";
  if(!mm&&shEl&&!shEl.hidden)closeDetail(true);
  if(!VIEWS.includes(h)){h="archiv";if(location.hash!=="#archiv")try{history.replaceState(null,"","#archiv")}catch(e){}}
  const prev=S.view;S.view=h;document.body.dataset.view=h;
  document.querySelectorAll("nav.side a[data-v]").forEach(a=>{if(a.dataset.v===S.view)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  document.title=(S.view==="archiv"?"":TITLES[S.view]+" · ")+"Studio Sommer_gram";
  render();if(prev!==S.view)scrollTo({top:0})}
addEventListener("hashchange",route);
const V=document.getElementById("view");
function render(){renderBanner();({archiv:vArchiv,analytics:vAnalytics,einstellungen:vSettings})[S.view]();
  if(S.pendingMO&&S.loaded){const m=S.media.find(x=>x.id===S.pendingMO);if(m){const id=S.pendingMO;S.pendingMO=null;setTimeout(()=>openMO(id),60)}}
  else if(shEl&&!shEl.hidden&&!shBusy)drawSheet()}
function renderBanner(){const b=document.getElementById("banner");
  if(!S.loaded&&db){b.innerHTML=`<div class="notice">Lädt …</div>`;return}
  b.innerHTML=S.mode==="lokal"&&S.loaded?`<div class="notice">Gerade ohne Sync: Was du hier änderst, bleibt nur in diesem Browser.</div>`:""}
const GEAR=`<a class="gx-hgear" href="#einstellungen" aria-label="Einstellungen"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></a>`;

/* ---------- Archiv ---------- */
const byNewest=(a,b)=>((b.date||"")+(b.time||"")).localeCompare((a.date||"")+(a.time||""));
function feedPosts(){return S.posts.filter(p=>p.status==="veroeffentlicht"&&p.format!=="STORY").sort(byNewest)}
function storyPosts(){const lim=iso(new Date(Date.now()-14*864e5));return S.posts.filter(p=>p.status==="veroeffentlicht"&&p.format==="STORY"&&(p.date||"")>=lim).sort(byNewest)}
function latestFol(){return [...S.insights].filter(i=>i.followers!=null).sort((a,b)=>a.date.localeCompare(b.date)).pop()||null}
const ICO_REEL=`<svg class="ax-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M10 8.8v6.4l5.2-3.2z" class="f"/></svg>`;
const ICO_CAR=`<svg class="ax-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="7" width="12.5" height="13.5" rx="2"/><path d="M8 3.5h10.5a2 2 0 0 1 2 2V16"/></svg>`;
function phTxt(p){return esc((TYPE_L[p.format]||"Beitrag")+(p.date?" · "+dShort(p.date):""))}
function vArchiv(){const feed=feedPosts(),stories=storyPosts();const L=latestFol();
  const line=`${L?nf(L.followers)+" Follower · ":""}${nf(feed.length)} ${feed.length===1?"Beitrag":"Beiträge"}`;
  const newBtn=`<a class="ax-new" href="werkstatt.html"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>Neues Reel</a>`;
  let h=`<header class="pg-head"><h1>Archiv</h1><p class="pg-sub">${S.loaded?line:"&nbsp;"}</p><div class="pg-acts">${newBtn}${GEAR}</div></header>`;
  if(stories.length)h+=`<div class="ax-stories" role="list" aria-label="Stories der letzten 14 Tage">${stories.map(p=>{const im=stillImg(p);return `<button class="ax-story" role="listitem" data-pid="${esc(p.id)}" aria-label="Story vom ${esc(fmtD(p.date))}">${im?`<img src="${esc(imgSrc(im))}" alt="" width="56" height="100" loading="lazy" decoding="async">`:`<span class="ax-ph">${esc(dShort(p.date))}</span>`}</button>`}).join("")}</div>`;
  if(!feed.length){h+=S.loaded?`<section class="ax-empty"><p>Hier erscheint, was auf Instagram online ist.</p>${newBtn}</section>`:"";V.innerHTML=`<div class="gx-pg ax">${h}</div>`;bindArchiv();return}
  h+=`<div class="ax-grid">${feed.map(p=>{const im=stillImg(p);const ic=p.format==="REEL"?ICO_REEL:p.format==="KARUSSELL"?ICO_CAR:"";
    return `<button class="ax-tile" data-pid="${esc(p.id)}" aria-label="${esc((TYPE_L[p.format]||"Beitrag")+" vom "+fmtD(p.date))}">${im?`<img src="${esc(imgSrc(im))}" alt="" width="300" height="400" loading="lazy" decoding="async">`:`<span class="ax-ph">${phTxt(p)}</span>`}${ic}</button>`}).join("")}</div>`;
  V.innerHTML=`<div class="gx-pg ax">${h}</div>`;bindArchiv()}
function bindArchiv(){V.querySelectorAll("[data-pid]").forEach(b=>b.onclick=()=>{const p=S.posts.find(x=>x.id===b.dataset.pid);if(p)openDetail(p,postMedia(p),b)});
  V.querySelectorAll(".ax-tile img,.ax-story img").forEach(i=>i.onerror=()=>{const b=i.closest("[data-pid]");const p=b&&S.posts.find(x=>x.id===b.dataset.pid);i.replaceWith(Object.assign(document.createElement("span"),{className:"ax-ph",innerHTML:p?(p.format==="STORY"?esc(dShort(p.date)):phTxt(p)):""}))})}

/* ---------- Einstellungen ---------- */
function themeNow(){try{return localStorage.getItem("sg-farbe")||"light"}catch(e){return "light"}}
function setTheme(k){try{localStorage.setItem("sg-farbe",k)}catch(e){}const r=document.documentElement;if(k==="auto")r.removeAttribute("data-sg");else r.setAttribute("data-sg",k);render();toast(k==="auto"?"Folgt jetzt dem Gerät":k==="dark"?"Dunkel eingestellt":"Hell eingestellt")}
function vSettings(){const cur=themeNow();const L=latestIns();const who=window.__studioUser||"";
  const opt=(k,l,t)=>`<button class="themeopt" data-theme-set="${k}" aria-pressed="${cur===k}"><span class="tprev ${k}" aria-hidden="true"><i></i><i></i><i></i></span><b>${l}</b><span class="small muted">${t}</span></button>`;
  const row=(l,v)=>`<div class="setrow"><span class="lbl">${l}</span><span>${v}</span></div>`;
  V.innerHTML=`<div class="gx-pg"><header class="pg-head"><h1>Einstellungen</h1></header><div class="setgrid">
  <section class="card"><h2>Darstellung</h2><p class="small muted" style="margin:6px 0 16px">Gilt für dieses Gerät.</p>
    <div class="themes" role="group" aria-label="Darstellung">${opt("light","Hell","Hell, ruhig wie Papier")}${opt("dark","Dunkel","Dunkel, die Fotos leuchten mehr")}${opt("auto","Automatisch","Wechselt mit dem Gerät zwischen hell und dunkel")}</div></section>
  <section class="card"><h2>Daten</h2><div style="margin-top:8px">
    ${row("Speichern",S.mode==="sync"?`<span class="status"><span class="dot" style="background:var(--ok)"></span>Synchron auf iPhone, iPad und Mac</span>`:`<span class="status"><span class="dot" style="background:var(--warn)"></span>Nur in diesem Browser</span>`)}
    ${row("Instagram-Zahlen",L?`Stand ${esc(standLong(L))}, kommen jeden Abend automatisch`:"Noch keine, der Abgleich am Abend trägt sie ein")}
  </div></section>
  <section class="card"><h2>Anmeldung</h2><div style="margin-top:8px">
    ${row("Konto",who?`<span class="row" style="gap:6px 16px">Angemeldet als ${esc(who)}<button class="linkish" id="logout">Abmelden</button></span>`:"Nicht angemeldet")}
  </div></section></div></div>`;
  V.querySelectorAll("[data-theme-set]").forEach(b=>b.onclick=()=>setTheme(b.dataset.themeSet));
  const lo=document.getElementById("logout");if(lo)lo.onclick=()=>{const o=document.getElementById("stOut");if(o)o.click()}}

/* ---------- Zahlen ---------- */
const PER={d7:[7,"7 Tage"],d30:[30,"30 Tage"],d90:[90,"90 Tage"]};
const TYPC={Bild:"var(--text)",Karussell:"var(--text-2)",Reel:"var(--text-2)",Story:"var(--text-3)"};
const sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0);
const mDay=m=>iso(new Date(m.ts));
const mTime=m=>{const d=new Date(m.ts);return pad(d.getHours())+":"+pad(d.getMinutes())};
function mPost(m){if(!m)return null;const k=S.posts.find(p=>p.igId===m.id);if(k)return k;if(m.type==="Story")return null;const d=mDay(m);const c=S.posts.filter(p=>p.date===d&&p.format!=="STORY"&&p.status==="veroeffentlicht"&&!p.igId);const want={Reel:"REEL",Karussell:"KARUSSELL",Bild:"POST"}[m.type];return c.find(p=>p.format===want)||c[0]||null}
function postMedia(p){return S.media.find(m=>m.id===p.igId)||(p.igId?null:S.media.find(m=>m.type!=="Story"&&!S.posts.some(x=>x.igId===m.id)&&mPost(m)===p))||null}
const SC64="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
function shortcode(id){let n=BigInt(id),s="";while(n>0n){s=SC64[Number(n%64n)]+s;n/=64n}return s}
function igLink(m){return m.type==="Story"?`https://www.instagram.com/insights/media/${m.id}/`:`https://www.instagram.com/${m.type==="Reel"?"reel":"p"}/${shortcode(m.id)}/`}
function latestIns(){return [...S.insights].filter(i=>i.periods).sort((a,b)=>(a.checkedAt||a.date).localeCompare(b.checkedAt||b.date)).pop()||null}
function standLong(i){if(!i)return "";if(i.checkedAt){const d=new Date(i.checkedAt);return WDL[d.getDay()]+", "+pad(d.getDate())+"."+pad(d.getMonth()+1)+"., "+pad(d.getHours())+":"+pad(d.getMinutes())}const d=parse(i.date);return WDL[d.getDay()]+", "+pad(d.getDate())+"."+pad(d.getMonth()+1)+"."}
/* Insights-Dokument, das etwa „days“ Tage vor „date“ liegt */
function insAround(date,days,pred){const t=parse(date).getTime()-days*864e5;const tol=Math.max(1.5,days*.15)*864e5;let best=null,bd=1e18;
  for(const i of S.insights){if(!i.date||(pred&&!pred(i)))continue;const d=Math.abs(parse(i.date).getTime()-t);if(d<=tol&&d<bd){bd=d;best=i}}return best}
function rate(list,k){const l=list.filter(m=>m.reach!=null&&m[k]!=null);const r=sum(l,"reach");return l.length&&r?sum(l,k)/r*100:null}
function delta(c,p){if(c==null||p==null||!isFinite(c)||!isFinite(p)||p===0)return "";const v=(c-p)/Math.abs(p)*100;const r=Math.round(v);
  return `<span class="kz-d" aria-label="${r>=0?"plus":"minus"} ${Math.abs(r)} Prozent zum vorigen Zeitraum">${r>=0?"▲":"▼"} ${Math.abs(r).toLocaleString("de-DE")} %</span>`}
const dec1=v=>v==null?"–":v.toLocaleString("de-DE",{minimumFractionDigits:1,maximumFractionDigits:1});
function seg(name,items,cur){return `<div class="seg" role="group" aria-label="${esc(name)}">${items.map(([k,l])=>`<button data-seg="${esc(name)}" data-k="${k}" aria-pressed="${k===cur}">${l}</button>`).join("")}</div>`}
function vAnalytics(){
  const per=PER[S.aPer]?S.aPer:"d30",[days,perL]=PER[per];
  const L=latestIns();const P=L&&L.periods&&L.periods[per]||null;
  const prevI=L?insAround(L.date,days,i=>i.periods&&i.periods[per]):null;const PP=prevI&&prevI.periods[per]||null;
  const ref=L&&L.checkedAt?new Date(L.checkedAt).getTime():Date.now();const from=ref-days*864e5,from2=from-days*864e5;
  const feed=S.media.filter(m=>m.type!=="Story");
  const cur=feed.filter(m=>m.ts>=from&&m.ts<=ref),prev=feed.filter(m=>m.ts>=from2&&m.ts<from);
  /* Follower: Veränderung im Zeitraum aus den täglichen Dokumenten */
  const fol=[...S.insights].filter(i=>i.followers!=null).sort((a,b)=>a.date.localeCompare(b.date));const lastF=fol[fol.length-1];
  const base=lastF?insAround(lastF.date,days,i=>i.followers!=null&&i.date<lastF.date):null;
  const fd=lastF&&base?lastF.followers-base.followers:null;
  const shr=rate(cur,"shares"),shr0=rate(prev,"shares"),sav=rate(cur,"saves"),sav0=rate(prev,"saves");
  const kpi=(v,name,d,extra)=>`<div class="kz"><span class="kz-v">${v}</span><span class="kz-n">${name}</span>${extra||""}${d||""}</div>`;
  const sgn=v=>v==null?"–":(v>0?"+":"")+nf(v);
  const head=`<header class="pg-head"><h1>Zahlen</h1><p class="pg-sub">${L?"Stand: "+esc(standLong(L)):"Noch keine Zahlen. Der Abgleich am Abend trägt sie ein."}</p><div class="pg-acts">${seg("Zeitraum",[["d7","7"],["d30","30"],["d90","90 Tage"]],per)}${GEAR}</div></header>`;
  const kpis=`<section class="kz-grid" aria-label="Kennzahlen, letzte ${perL}">
    ${kpi(nf(P&&P.views),"Aufrufe",delta(P&&P.views,PP&&PP.views))}
    ${kpi(nf(P&&P.reach),`Betrachter <small>(Reichweite)</small>`,delta(P&&P.reach,PP&&PP.reach))}
    ${kpi(sgn(fd),"Follower","",lastF?`<span class="kz-s">jetzt ${nf(lastF.followers)}</span>`:"")}
    ${kpi(dec1(shr),"Geteilt pro 100 Betrachter",delta(shr,shr0))}
    ${kpi(dec1(sav),"Gespeichert pro 100 Betrachter",delta(sav,sav0))}
    ${kpi(nf(P&&P.interactions),"Interaktionen",delta(P&&P.interactions,PP&&PP.interactions))}
  </section>`;
  const srt=S.aSort==="date"?"date":"views";const list=[...cur].sort(srt==="date"?(a,b)=>b.ts-a.ts:(a,b)=>(b.views||0)-(a.views||0)||b.ts-a.ts);
  const rows=list.map(m=>{const p=mPost(m);const im=stillImg(p);return `<li><button class="bz" data-mid="${esc(m.id)}"><span class="bz-th">${im?`<img src="${esc(imgSrc(im))}" alt="" width="48" height="64" loading="lazy" decoding="async">`:""}</span><span class="bz-t"><b>${esc(fmtD(mDay(m)))}</b><small>${esc(MTYPE_L[m.type]||m.type)}</small></span><span class="bz-n"><b>${nf(m.views)}</b><small>Aufrufe</small></span><span class="bz-n"><b>${nf(m.shares)}</b><small>Geteilt</small></span></button></li>`}).join("");
  const posts=`<section class="card"><div class="cardhead"><h2>Beiträge im Zeitraum</h2>${seg("Sortieren",[["views","Aufrufe"],["date","Datum"]],srt)}</div>
    ${list.length?`<ol class="bz-list">${rows}</ol>`:`<p class="small muted">In den letzten ${perL} kam kein Beitrag.</p>`}</section>`;
  V.innerHTML=`<div class="gx-pg kz-pg">${head}${kpis}${vHistory()}${posts}</div>`;
  V.querySelectorAll("[data-mid]").forEach(el=>el.onclick=()=>openMO(el.dataset.mid,el));
  V.querySelectorAll('[data-seg="Zeitraum"]').forEach(b=>b.onclick=()=>{S.aPer=b.dataset.k;render()});
  V.querySelectorAll('[data-seg="Sortieren"]').forEach(b=>b.onclick=()=>{S.aSort=b.dataset.k;render()});
  V.querySelectorAll('[data-seg="Verlauf"]').forEach(b=>b.onclick=()=>{S.chartMetric=b.dataset.k;render()});
  V.querySelectorAll(".bz-th img").forEach(i=>i.onerror=()=>i.remove());
  const f=document.getElementById("insForm");if(f)f.onsubmit=async e=>{e.preventDefault();const date=document.getElementById("i-date").value;const fv=document.getElementById("i-f").value,v=document.getElementById("i-v").value;
    if(!date||(fv===""&&v==="")){toast("Mindestens einen Wert eintragen");return}
    const old=S.insights.find(x=>x.date===date)||{};const i={...old,date,followers:fv===""?(old.followers??null):+fv,views30:v===""?(old.views30??null):+v};
    try{await saveInsight(i);toast("Zahlen gespeichert")}catch(err){toast("Speichern hat nicht geklappt")}};
}
/* Verlauf: eine Linie, nur Anfang und Ende beschriftet */
function lineChart(pts,label){
  if(pts.length<2)return `<p class="small muted">${pts.length?"Ein Punkt ist da. Ab dem zweiten Abend entsteht hier eine Linie.":"Noch keine Werte. Jeder Abgleich am Abend setzt einen Punkt."}</p>`;
  const W=1000,H=200,PAD=6;
  const xs=pts.map(p=>parse(p.date).getTime());const ys=pts.map(p=>p.v);
  const x0=Math.min(...xs),x1=Math.max(...xs);let y0=Math.min(...ys),y1=Math.max(...ys);if(y0===y1){y0-=1;y1+=1}
  const sx=x=>(x-x0)/(x1-x0||1)*W,sy=y=>PAD+(1-(y-y0)/(y1-y0))*(H-2*PAD);
  const line=pts.map((p,i)=>(i?"L":"M")+sx(xs[i]).toFixed(1)+" "+sy(p.v).toFixed(1)).join(" ");
  const a=pts[0],z=pts[pts.length-1];
  return `<div class="kz-ends"><span><b>${nf(a.v)}</b><small>${dShort(a.date)}</small></span><span><b>${nf(z.v)}</b><small>${dShort(z.date)}</small></span></div>
  <div class="kz-ch" role="img" aria-label="${esc(label)}: von ${nf(a.v)} am ${dShort(a.date)} auf ${nf(z.v)} am ${dShort(z.date)}">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${line}" fill="none" stroke="var(--text)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
    <i class="kz-dot" style="top:${(sy(z.v)/H*100).toFixed(2)}%"></i></div>`}
function vHistory(){const ins=[...S.insights].sort((a,b)=>a.date.localeCompare(b.date));const last=ins[ins.length-1];
  const key=S.chartMetric==="views30"?"views30":"followers";const pts=ins.filter(i=>i[key]!=null).map(i=>({date:i.date,v:+i[key]}));
  return `<section class="card chart">
    <div class="cardhead"><h2>Verlauf</h2>${seg("Verlauf",[["followers","Follower"],["views30","Aufrufe 30 Tage"]],key)}</div>
    ${lineChart(pts,key==="followers"?"Follower":"Aufrufe 30 Tage")}
    <details style="margin-top:12px"><summary class="small">Zahlen von Hand nachtragen</summary>
    <form id="insForm" class="row" style="margin-top:12px;align-items:flex-end">
      <label class="stack" style="flex:1 1 140px"><span class="lbl">Datum</span><input class="field" type="date" id="i-date" value="${iso(new Date())}" required></label>
      <label class="stack" style="flex:1 1 140px"><span class="lbl">Follower</span><input class="field" type="number" min="0" inputmode="numeric" id="i-f" placeholder="${last&&last.followers!=null?last.followers:""}"></label>
      <label class="stack" style="flex:1 1 160px"><span class="lbl">Aufrufe, 30 Tage</span><input class="field" type="number" min="0" inputmode="numeric" id="i-v" placeholder="${last&&last.views30!=null?last.views30:""}"></label>
      <button class="btn" type="submit">Eintragen</button>
    </form></details>
  </section>`}

/* ---------- Detail: Blatt von unten (iPhone), Fenster (Mac) ---------- */
let shEl=null,shBusy=false,shSrc=null;const SH={p:null,m:null};let moId=null;
function openMO(id,src){const m=S.media.find(x=>x.id===id);if(!m)return;openDetail(mPost(m),m,src)}
function openDetail(p,m,src){if(!p&&!m)return;SH.p=p||null;SH.m=m||null;moId=m?m.id:null;shSrc=src||null;
  if(!shEl){shEl=document.createElement("div");shEl.className="sh";shEl.hidden=true;document.body.appendChild(shEl);
    shEl.addEventListener("click",e=>{if(e.target.closest("[data-shx]")||!e.target.closest(".sh-card"))closeDetail()});
    document.addEventListener("keydown",e=>{if(shEl&&!shEl.hidden&&e.key==="Escape")closeDetail()});
    /* Nach unten wischen schließt */
    let y0=null,dy=0;const card=()=>shEl.querySelector(".sh-card");
    shEl.addEventListener("touchstart",e=>{const c=card();if(!c||!c.contains(e.target)||c.scrollTop>0){y0=null;return}y0=e.touches[0].clientY;dy=0},{passive:true});
    shEl.addEventListener("touchmove",e=>{if(y0==null)return;dy=Math.max(0,e.touches[0].clientY-y0);const c=card();if(c&&dy>0){c.style.transition="none";c.style.transform=`translateY(${dy}px)`}},{passive:true});
    shEl.addEventListener("touchend",()=>{if(y0==null)return;y0=null;const c=card();if(!c)return;c.style.transition="";c.style.transform="";if(dy>80)closeDetail()},{passive:true})}
  if(!shEl.hidden&&!shBusy){drawSheet();return}
  shBusy=false;shEl.classList.remove("on");shEl.hidden=false;drawSheet();document.documentElement.style.overflow="hidden";
  void shEl.offsetWidth;shEl.classList.add("on");
  const x=shEl.querySelector(".sh-x");if(x)x.focus({preventScroll:true})}
function closeDetail(now){if(!shEl||shEl.hidden||(shBusy&&!now))return;shBusy=true;shEl.classList.remove("on");
  if(/^#analytics(-|\/m\/)\d+$/.test(location.hash))try{history.replaceState(null,"","#zahlen")}catch(e){}
  const done=()=>{if(!shBusy)return;shBusy=false;shEl.hidden=true;shEl.innerHTML="";moId=null;document.documentElement.style.overflow="";if(shSrc&&document.contains(shSrc))shSrc.focus({preventScroll:true})};
  if(now||noMotion()){done();return}setTimeout(done,200)}
function shStats(){const m=SH.m,st=SH.p&&SH.p.stats||{};const g=k=>m&&m[k]!=null?m[k]:st[k];
  return [["Aufrufe",g("views")],["Betrachter",g("reach")],["Interaktionen",g("interactions")],["Geteilt",g("shares")],["Gespeichert",g("saves")],["Neue Follower",g("follows")]]}
function drawSheet(){const p=SH.p,m=SH.m;
  if(p){const np=S.posts.find(x=>x.id===p.id);if(np)SH.p=np}
  if(!SH.p&&m){const np=mPost(m);if(np)SH.p=np}
  const P2=SH.p;const isS=m?m.type==="Story":P2&&P2.format==="STORY";
  const type=m?(MTYPE_L[m.type]||m.type):(TYPE_L[P2.format]||"Beitrag");
  let date="",time="";if(m&&m.ts){const d=new Date(m.ts);date=iso(d);time=mTime(m)}else if(P2){date=P2.date||"";time=P2.time||""}
  const dd=date?parse(date):null;const when=dd?`${WDL[dd.getDay()]}, ${pad(dd.getDate())}.${pad(dd.getMonth()+1)}.${dd.getFullYear()}${time?", "+esc(time):""}`:"";
  const im=stillImg(P2);const cap=P2&&P2.caption?String(P2.caption).trim():"";
  shEl.setAttribute("role","dialog");shEl.setAttribute("aria-modal","true");shEl.setAttribute("aria-label",type+(when?", "+when:""));
  shEl.innerHTML=`<div class="sh-card${isS?" st":""}">
    <span class="sh-grab" aria-hidden="true"></span>
    <div class="sh-media">${im?`<img src="${esc(imgSrc(im))}" alt="${esc(type)}" decoding="async">`:`<span class="ax-ph">${esc(type)}${date?" · "+esc(dShort(date)):""}</span>`}</div>
    <div class="sh-info">
      <p class="sh-meta"><b class="sh-type">${esc(type)}</b> · ${when}</p>
      ${cap?`<p class="sh-cap">${esc(cap)}</p>`:""}
      <dl class="sh-stats">${shStats().map(([l,v])=>`<div><dt>${l}</dt><dd>${nf(v)}</dd></div>`).join("")}</dl>
      ${m?`<p class="sh-link"><a href="${igLink(m)}" target="_blank" rel="noopener">${isS?"Insights in Instagram":"In Instagram ansehen"}</a></p><input type="file" accept="image/*" data-sbfile hidden aria-label="Bild zu diesem Beitrag">`:""}
    </div>
    <button class="sh-x" data-shx aria-label="Schließen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`;
  const fi=shEl.querySelector("[data-sbfile]");if(fi)fi.onchange=e=>{if(m)attachShot(m,e.target.files[0])};
  const img=shEl.querySelector(".sh-media img");if(img)img.onerror=()=>img.replaceWith(Object.assign(document.createElement("span"),{className:"ax-ph",textContent:type}))}
/* Bild einfügen (Abgleich am Abend): Standbild an den Post hängen */
async function trimShot(f){const url=URL.createObjectURL(f);const img=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=url});
  const W=img.naturalWidth,H=img.naturalHeight;const sw=Math.min(240,W),sh=Math.round(H*sw/W);const c=document.createElement("canvas");c.width=sw;c.height=sh;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(img,0,0,sw,sh);
  const d=x.getImageData(0,0,sw,sh).data;const lum=(i)=>.2126*d[i]+.7152*d[i+1]+.0722*d[i+2];
  const colDark=cx=>{let mx=0,sum=0;for(let y=0;y<sh;y++){const l=lum((y*sw+cx)*4);sum+=l;if(l>mx)mx=l}return sum/sh<16&&mx<60};
  const rowDark=cy=>{let mx=0,sum=0;for(let xx=0;xx<sw;xx++){const l=lum((cy*sw+xx)*4);sum+=l;if(l>mx)mx=l}return sum/sw<16&&mx<60};
  let l=0,r=sw-1,t=0,b=sh-1;while(l<r&&colDark(l))l++;while(r>l&&colDark(r))r--;while(t<b&&rowDark(t))t++;while(b>t&&rowDark(b))b--;
  const k=W/sw;let cx=Math.floor(l*k),cy=Math.floor(t*k),cw=Math.ceil((r-l+1)*k),ch=Math.ceil((b-t+1)*k);if(cw<W*.2||ch<H*.2){cx=0;cy=0;cw=W;ch=H}
  const ow=Math.min(1080,cw),oh=Math.round(ch*ow/cw);const o=document.createElement("canvas");o.width=ow;o.height=oh;o.getContext("2d").drawImage(img,cx,cy,cw,ch,0,0,ow,oh);URL.revokeObjectURL(url);
  const blob=await new Promise(r=>o.toBlob(r,"image/jpeg",.86));return {file:new File([blob],"bild.jpg",{type:"image/jpeg"}),ratio:ow/oh}}
async function attachShot(m,f){if(!f)return;if(!assets||!db){toast("Bild speichern geht erst nach der Anmeldung");return}
  shEl.dataset.saved="";
  try{const t=await trimShot(f);const res=await assets.upload(t.file);let p=mPost(m);const d=new Date(m.ts);
    if(!p)p={id:"ig-"+m.id,title:m.type==="Story"?"Story":m.type==="Bild"?"Beitrag":m.type,format:{Story:"STORY",Reel:"REEL",Karussell:"KARUSSELL",Bild:"POST"}[m.type],status:"veroeffentlicht",source:"instagram",date:iso(d),time:pad(d.getHours())+":"+pad(d.getMinutes()),ort:"",caption:"",tags:"",images:[]};
    const np={...p,igId:m.id,images:[{id:res.id,type:"image/jpeg",ratio:t.ratio,shot:true}],stats:p.stats||{views:m.views,interactions:m.interactions,likes:m.likes}};
    await savePost(np);const i=S.posts.findIndex(x=>x.id===np.id);if(i>=0)S.posts[i]=np;else S.posts.push(np);
    if(moId===m.id&&!shEl.hidden){SH.p=np;drawSheet();shEl.dataset.saved=m.id}toast("Bild gespeichert")}
  catch(e){toast(e&&e.code==="too_large"?"Bild zu groß":"Bild konnte nicht gespeichert werden")}}
document.addEventListener("paste",e=>{if(!shEl||shEl.hidden||!shEl.querySelector("[data-sbfile]"))return;const it=[...(e.clipboardData&&e.clipboardData.items||[])].find(x=>x.kind==="file"&&/^image\//.test(x.type));if(!it)return;e.preventDefault();const m=S.media.find(x=>x.id===moId);const f=it.getAsFile();if(m&&f)attachShot(m,f)});

/* ---------- Start ---------- */
lsLoad();try{route()}catch(e){console.error(e)}
(async()=>{
  if(!window.claude||!window.claude.use){S.loaded=true;render();return}
  const timer=setTimeout(()=>{if(!S.loaded){S.loaded=true;render()}},10000);
  db=await claude.use("db");
  if(db){S.mode="sync";
    db.collection("posts").onSnapshot(snap=>{S.posts=snap.docs.map(d=>({...d.data(),id:d.id}));S.loaded=true;clearTimeout(timer);render()},e=>{S.loaded=true;if(e.code==="revoked"||e.code==="not_granted"){db=null;S.mode="lokal";lsLoad()}render()});
    db.collection("insights").onSnapshot(snap=>{S.insights=snap.docs.map(d=>d.data());render()},()=>{});
    db.collection("ig_media").onSnapshot(snap=>{S.media=snap.docs.map(d=>({...d.data(),id:d.id})).filter(m=>m.ts);render()},()=>{});
  }else{S.loaded=true;clearTimeout(timer)}
  claude.use("assets").then(a=>{assets=a;render()});
})();
</script>
